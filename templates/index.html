<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOZ Review</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-body: #0d1117;
            --bg-card: #161b22;
            --bg-card-header: #21262d;
            --border-color: #30363d;
            --text-color: #e6edf3;
            --muted-color: #8b949e;
            --link-color: #58a6ff;
            --input-bg: #0d1117;
            --hover-bg: #21262d;
        }
        body.light-mode {
            --bg-body: #e9eef5;
            --bg-card: #fdfefe;
            --bg-card-header: #f3f6fb;
            --border-color: #cfd8e3;
            --text-color: #223042;
            --muted-color: #5f6f82;
            --link-color: #2f6fec;
            --input-bg: #f8fafd;
            --hover-bg: #e8eef8;
        }
        body { 
            background: var(--bg-body) !important; 
            color: var(--text-color) !important;
        }
        .card { 
            background: var(--bg-card) !important; 
            border: 1px solid var(--border-color) !important;
        }
        .card-header { 
            background: var(--bg-card-header) !important; 
            border-bottom: 1px solid var(--border-color) !important;
            color: var(--text-color) !important;
        }
        .card-body {
            color: var(--text-color) !important;
        }
        .table {
            color: var(--text-color) !important;
        }
        .table-dark {
            --bs-table-bg: var(--bg-card);
            --bs-table-color: var(--text-color);
        }
        .table-hover > tbody > tr:hover {
            background-color: var(--hover-bg) !important;
        }
        .text-muted { color: var(--muted-color) !important; }
        a { color: var(--link-color) !important; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .company-name { color: #f0883e !important; font-weight: 600; }
        body.light-mode .company-name { color: #b45309 !important; }
        .review-content { font-size: 0.95rem; line-height: 1.6; color: var(--text-color) !important; }
        .badge-count { background: #238636 !important; }
        body.light-mode .badge-count { background: #2f6fec !important; color: #ffffff !important; }
        .btn-primary { background: #238636 !important; border: none !important; }
        .btn-primary:hover { background: #2ea043 !important; }
        body.light-mode .btn-primary {
            background: #2f6fec !important;
            color: #ffffff !important;
            border: 1px solid #2f6fec !important;
        }
        body.light-mode .btn-primary:hover {
            background: #255fd1 !important;
            border-color: #255fd1 !important;
        }
        .btn-secondary { background: #21262d !important; border: 1px solid #30363d !important; color: #e6edf3 !important; }
        .btn-secondary:hover { background: #30363d !important; }
        input, select { 
            background: var(--input-bg) !important; 
            border: 1px solid var(--border-color) !important; 
            color: var(--text-color) !important;
        }
        input::placeholder { color: #6e7681 !important; }
        .navbar { background: var(--bg-card) !important; border-bottom: 1px solid var(--border-color) !important; }
        .navbar-dark .navbar-brand { color: var(--text-color) !important; }
        .navbar-dark .nav-link { color: var(--text-color) !important; }
        .navbar-dark .nav-link:hover { color: var(--link-color) !important; }
        .pagination { --bs-pagination-bg: var(--bg-card); --bs-pagination-color: var(--text-color); --bs-pagination-border-color: var(--border-color); }
        .page-link { background: var(--bg-card) !important; color: var(--text-color) !important; border-color: var(--border-color) !important; }
        .page-link:hover { background: var(--hover-bg) !important; }
        .page-item.active .page-link { background: #238636 !important; border-color: #238636 !important; }
        h2, h3, h4, h5 { color: var(--text-color) !important; }
        small { color: var(--muted-color) !important; }
        .form-control:focus { 
            background: var(--input-bg) !important;
            border-color: var(--link-color) !important;
            color: var(--text-color) !important;
            box-shadow: 0 0 0 0.25rem rgba(88, 166, 255, 0.25);
        }
        .theme-toggle {
            width: 38px;
            height: 38px;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 999px;
        }
        body.light-mode .btn-secondary {
            background: #f8fafd !important;
            border-color: #cfd8e3 !important;
            color: #334155 !important;
        }
        body.light-mode .btn-secondary:hover {
            background: #e8eef8 !important;
            color: #223042 !important;
        }
        body.light-mode .navbar,
        body.light-mode .card,
        body.light-mode .card-header,
        body.light-mode .card-body,
        body.light-mode .table,
        body.light-mode .table-dark,
        body.light-mode .table-dark > :not(caption) > * > *,
        body.light-mode .page-link,
        body.light-mode .form-control,
        body.light-mode .form-select {
            background: var(--bg-card) !important;
            color: var(--text-color) !important;
            border-color: var(--border-color) !important;
        }
        body.light-mode .card-header,
        body.light-mode .navbar {
            background: var(--bg-card-header) !important;
        }
        body.light-mode input,
        body.light-mode select {
            background: var(--input-bg) !important;
            color: var(--text-color) !important;
        }
        body.light-mode .table-hover > tbody > tr:hover,
        body.light-mode .page-link:hover {
            background: var(--hover-bg) !important;
        }
        body.light-mode h2,
        body.light-mode h3,
        body.light-mode h4,
        body.light-mode h5,
        body.light-mode small,
        body.light-mode td,
        body.light-mode th,
        body.light-mode label,
        body.light-mode .navbar-brand,
        body.light-mode .nav-link,
        body.light-mode .review-content {
            color: var(--text-color) !important;
        }
        body.light-mode .text-muted,
        body.light-mode small,
        body.light-mode label.form-label {
            color: var(--muted-color) !important;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark" style="background: #161b22; border-bottom: 1px solid #30363d;">
        <div class="container">
            <a class="navbar-brand" href="/">🔍 VOZ Review</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
                    <li class="nav-item"><a class="nav-link" href="/">🏢 Company</a></li>
                    <li class="nav-item"><a class="nav-link" href="/threads">🧵 Threads</a></li>
                    <li class="nav-item ms-lg-2">
                        <button type="button" class="btn btn-sm btn-secondary theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme" title="Toggle theme">🌙</button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="card mb-4">
            <div class="card-body">
                <form action="/search" method="get" class="row g-3 align-items-end">
                    <div class="col-md-10">
                        <label for="search-q" class="form-label text-muted">Search reviews</label>
                        <input type="text" id="search-q" name="q" class="form-control form-control-lg" placeholder="Ví dụ: Fsoft, Zalo, CMC, lương, backend...">
                    </div>
                    <div class="col-md-2 d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">Search</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-body">
                <form action="/" method="get" class="row g-3 align-items-end">
                    <div class="col-md-6">
                        <label for="q" class="form-label text-muted">Filter company</label>
                        <input type="text" id="q" name="q" class="form-control" placeholder="Ví dụ: Fsoft, Zalo, CMC..." value="{{ query or '' }}">
                    </div>
                    <div class="col-md-4">
                        <label for="sort" class="form-label text-muted">Sort by</label>
                        <select id="sort" name="sort" class="form-select">
                            <option value="az" {% if sort == 'az' %}selected{% endif %}>A-Z</option>
                            <option value="most_review" {% if sort == 'most_review' %}selected{% endif %}>Most review</option>
                            <option value="recent_review" {% if sort == 'recent_review' %}selected{% endif %}>Recent review</option>
                            <option value="salary_desc" {% if sort == 'salary_desc' %}selected{% endif %}>Salary high to low</option>
                        </select>
                    </div>
                    <div class="col-md-2 d-grid">
                        <button type="submit" class="btn btn-primary">Apply</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Company List -->
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">🏢 Company</h5>
                <small class="text-muted">{{ companies|length }} results</small>
            </div>
            <div class="card-body p-0">
                <table class="table table-dark table-hover mb-0">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Reviews</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="companyTable">
                        {% for company in companies %}
                        <tr>
                            <td><a href="/company/{{ company.name }}" class="company-name">{{ company.name }}</a></td>
                            <td><span class="badge badge-count">{{ company.review_count }}</span></td>
                            <td><a href="/company/{{ company.name }}" class="btn btn-sm btn-secondary">View</a></td>
                        </tr>
                        {% else %}
                        <tr>
                            <td colspan="3" class="text-center text-muted py-4">
                                Chưa có công ty nào. Vào tab Threads để bắt đầu crawl!
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const THEME_KEY = 'voz-review-theme';
        function applyTheme(theme) {
            document.body.classList.toggle('light-mode', theme === 'light');
            const button = document.querySelector('.theme-toggle');
            if (button) button.textContent = theme === 'light' ? '☀️' : '🌙';
        }
        function toggleTheme() {
            const nextTheme = document.body.classList.contains('light-mode') ? 'dark' : 'light';
            localStorage.setItem(THEME_KEY, nextTheme);
            applyTheme(nextTheme);
        }
        applyTheme(localStorage.getItem(THEME_KEY) || 'dark');
    </script>
</body>
</html>
